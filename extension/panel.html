<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WebD</title><link rel="stylesheet" href="panel.css"></head>
<body><main><p class="eyebrow">aiDo / WebD · prototype</p><h1>Show, don't prompt.</h1><p>Select an element in a page you control and prepare a focused change request.</p><button id="pick">Select element</button><p id="status" role="status">Open your development preview, then select an element.</p><label for="change">Requested change</label><textarea id="change" rows="3" placeholder="Make this button wider on mobile."></textarea><label for="context">Edit context — inspect and redact before sharing</label><textarea id="context" rows="14" spellcheck="false" placeholder="Select an element first."></textarea><button id="copy" disabled>Copy edit context</button><p class="small">No network requests or AI calls. The copied text is yours to share.</p></main><script src="panel.js"></script></body></html>
