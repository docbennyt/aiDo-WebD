name: WebD checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: node --check extension/background.js && node --check extension/picker.mjs && node --check extension/panel.mjs && node --test tests/context.test.mjs
      - run: python -m pip install -r tests/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python tests/dom.py && python tests/extension.py
      - run: python scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: webd-extension-candidate
          path: dist/webd-extension.zip
          if-no-files-found: error
