name: WebD checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: node --check extension/background.js && node --check extension/picker.mjs && node --check extension/panel.mjs && node --test tests/context.test.mjs
      - run: python -m pip install -r tests/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python tests/dom.py && python tests/extension.py
      - run: python scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: webd-extension-candidate
          path: dist/webd-extension.zip
          if-no-files-found: error
